luacheck:
  name: luacheck
  slug: luacheck
  url: https://luacheck.readthedocs.io/
  description: >-
    A widely used static analyzer and linter for Lua. Reports undefined
    globals, unused variables and shadowed standard library globals.

selene:
  name: selene
  slug: selene
  url: https://kampfkarren.github.io/selene/
  description: >-
    An opinionated linter for Lua written in Rust. Flags undefined globals,
    shadowed built-ins and other style and correctness issues.

emmylua-analyzer:
  name: EmmyLua Analyzer
  slug: emmylua-analyzer
  url: https://github.com/EmmyLuaLs/emmylua-analyzer-rust
  description: >-
    A Lua language server and static analyzer written in Rust, driven by the
    EmmyLua annotation dialect. Reports type, nil-safety, dead-code and other
    diagnostics over the Language Server Protocol.

semgrep:
  name: semgrep
  slug: semgrep
  url: https://github.com/ligurio/semgrep-rules/
  description: >-
    A pattern-based static analysis tool that searches source code for
    user-defined rules. Custom Lua rules cover language pitfalls and the
    Tarantool box.* API.

