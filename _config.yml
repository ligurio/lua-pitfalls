title: Lua Pitfalls
description: >-
  Pitfalls and anti-patterns when programming in Lua, grouped by Lua runtime,
  static analyzers and platform sections (OpenResty, Tarantool).
lang: en

# Site is a GitHub Pages project page served at /lua-pitfalls/, so links built
# with `relative_url` get this baseurl prefix.
url: "https://ligurio.github.io"
baseurl: "/lua-pitfalls"

# Pretty URLs for tag pages: /runtimes/lua-5.1/, /analyzers/luacheck/.
# The `pitfalls` collection has its own permalink below.
permalink: pretty

# GitHub Pages uses kramdown + Rouge for syntax highlighting.
markdown: kramdown
highlighter: rouge

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

collections:
  pitfalls:
    output: true
    # Each pitfall file sets its own `permalink: /p/L100N/` in the front matter
    # (preserves the exact case of the ID); this is only a fallback.
    permalink: /p/:slug/
  openresty:
    output: true
    # Files set their own `permalink: /o/O100N/` to keep the case of the ID.
    permalink: /o/:slug/
  tarantool:
    output: true
    # Files set their own `permalink: /t/T100N/` to keep the case of the ID.
    permalink: /t/:slug/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: _pitfalls
    values:
      layout: pitfall
  - scope:
      path: _openresty
    values:
      layout: pitfall
  - scope:
      path: _tarantool
    values:
      layout: pitfall
